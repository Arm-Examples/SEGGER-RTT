# SPDX-License-Identifier: Apache-2.0

name: Build SEGGER RTT STM32F407

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  CI_build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Activate vcpkg
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: "./vcpkg-configuration.json"

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build images for STM32F407G-DISC1 board
        working-directory: ./STM/STM32F407G-DISC1
        run: >-
          cbuild RTT.csolution.yml
          --active STM32F407VGTx@console
          --packs

      - name: Upload output for context RTT.Debug+STM32F407VGTx
        uses: actions/upload-artifact@v7
        with:
          name: SEGGER-RTT_artifact
          path: |
            ./STM/STM32F407G-DISC1/out/
