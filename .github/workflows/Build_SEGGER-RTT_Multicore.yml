# SPDX-License-Identifier: Apache-2.0

name: Build SEGGER RTT Multicore

on:
  workflow_dispatch:

jobs:
  CI_build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Activate vcpkg
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: "./vcpkg-configuration.json"

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build multicore images
        working-directory: ./Infineon/T2G-B-H
        run: >-
          cbuild SEGGER-RTT_Multicore.csolution.yml
          --active CYT4BF8CDS@file-io
          --packs

      - name: Upload output for context T2G.Release+T2G-Kit
        uses: actions/upload-artifact@v7
        with:
          name: SEGGER-RTT_Multicore_artifact
          path: |
            ./Infineon/T2G-B-H/out/
