# SPDX-License-Identifier: Apache-2.0

name: Run SEGGER RTT Multicore

on:
  workflow_run:
    workflows:
      - Build SEGGER RTT Multicore
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Only one job may use the physical board at a time.
concurrency:
  group: t2g-b-h-hardware
  cancel-in-progress: false

jobs:
  CI_run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, rsp-p5-01]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download artifact from triggering build
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v21
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: SEGGER-RTT_Multicore_artifact
          path: ./Infineon/T2G-B-H/out

      - name: Download latest successful build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: Build_SEGGER-RTT_Multicore.yml
          branch: main
          workflow_conclusion: success
          name: SEGGER-RTT_Multicore_artifact
          path: ./Infineon/T2G-B-H/out

      - name: Program target
        working-directory: ./Infineon/T2G-B-H/out
        run: >-
          pyocd load
          --uid 0D18149E02272400
          --cbuild-run RTT_Multicore+CYT4BF8CDS.cbuild-run.yml

      - name: Run target and collect RTT output
        working-directory: ./Infineon/T2G-B-H/out
        run: >-
          pyocd run
          --uid 0D18149E02272400
          --cbuild-run RTT_Multicore+CYT4BF8CDS.cbuild-run.yml
          --eot
          -O reset_type=sysresetreq
          --timelimit 10

      - name: Verify output from every core
        working-directory: ./Infineon/T2G-B-H/out
        run: |
          grep -Fq "Hello from CM0+ core!" output_Cortex-M0p.txt
          grep -Fq "Hello from CM7-0 core!" output_Cortex-M7-0.txt
          grep -Fq "Hello from CM7-1 core!" output_Cortex-M7-1.txt
