# Blank CMSIS-Toolbox cproject template.
# Generated by Microchip.PIC32CM-PL_DFP.
#
# Reference: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/
#
# This cproject is device-agnostic; the active device is chosen by the
# companion csolution's target-types entry. Edit this file to add your own
# sources, components and build settings.

project:
  description: SEGGER-RTT example project.

  # -----------------------------------------------------------------
  # Source groups - list application sources here.
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#groups
  # -----------------------------------------------------------------
  groups:
    - group: App
      files:
        - file: ./main.c

  # -----------------------------------------------------------------
  # Software components sourced from packs listed in the csolution.
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#components
  # Component syntax: [Cvendor::]Cclass[&Cbundle]:Cgroup[:Csub][&Cvariant][@[>=]Cversion]
  # -----------------------------------------------------------------
  components:
    - component: ARM::CMSIS:CORE
    - component: Device:Startup
    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDOUT:RTT
    - component: SEGGER:RTT
    - component: CMSIS-Compiler:STDIN:RTT
    - component: CMSIS-Compiler:TTY:RTT

  # -----------------------------------------------------------------
  # Toolchain-specific options.
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#misc
  # -----------------------------------------------------------------
  misc:
    - for-compiler: AC6
      Link:
        - --diag_suppress=L6314W # armlink: no section matches pattern

  # -----------------------------------------------------------------
  # Build output artefacts. Valid types: lib | elf | hex | bin | map
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#output
  # -----------------------------------------------------------------
  output:
    type:
      - elf
      - hex
      - map
  packs:
    - pack: SEGGER::RTT
    - pack: ARM::CMSIS-Compiler
