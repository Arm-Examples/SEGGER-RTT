# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault: # use CMSIS-Toolbox default Compiler options

  # Compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR
    - compiler: CLANG

  # List of miscellaneous tool-specific controls
  misc:
    - for-compiler: AC6 # GDB requires DWARF 5, remove when using uVision Debugger
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5

  # List the packs that define the device and/or board.
  packs:
    - pack: Infineon::KIT_T2G-B-E_LITE_BSP
    - pack: Infineon::T2G-B-E_DFP
    - pack: ARM::CMSIS

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: CYT2BL5CAS
      board: KIT_T2G-B-E_LITE:V1
      device: CYT2BL5CAS
      target-set:
        - set:
          images:
            - project-context: SEGGER-RTT_Cortex-M4.Debug
            - project-context: SEGGER-RTT_Cortex-M0p.Debug
          debugger:
            name: CMSIS-DAP@pyOCD
            clock: 10000000
            protocol: swd
            telnet:
              - pname: Cortex-M0p
                mode: console
              - pname: Cortex-M4
                mode: console
            rtt:
              - pname:  Cortex-M0p
                channel:
                  - number: 0
                    mode: stdio
              - pname:  Cortex-M4
                channel:
                  - number: 0
                    mode: stdio
 
  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none

    - type: Release
      debug: off
      optimize: balanced

  # List related projects.
  projects:
    - project: Cortex-M0p/SEGGER-RTT_Cortex-M0p.cproject.yml
    - project: Cortex-M4/SEGGER-RTT_Cortex-M4.cproject.yml
  compiler: AC6
