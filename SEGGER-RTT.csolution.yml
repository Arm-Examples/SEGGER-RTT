# Blank CMSIS-Toolbox solution for PIC32CM6408PL10048.
# Generated by Microchip.PIC32CM-PL_DFP.
#
# Reference: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/
#
# This solution binds Blank.cproject.yml to a specific device. Edit the
# packs, compilers and build-types lists to suit your project.

solution:
  description: SEGGER-RTT solution for PIC32CM6408PL10048.

  # ------------------------------------------------------------------
  # Minimum CMSIS-Toolbox version this solution expects.
  # ------------------------------------------------------------------
  created-for: cmsis-toolbox@2.13.0

  # ------------------------------------------------------------------
  # Compiler selection. Remove entries for compilers you do not use.
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#select-compiler
  # Available compiler IDs: AC6 | GCC | IAR | CLANG | CLANG_TI | XC
  # ------------------------------------------------------------------
  select-compiler:
    - compiler: AC6 # Arm Compiler 6 (Keil MDK)
    - compiler: GCC # Arm GNU Toolchain
    - compiler: CLANG # Arm Toolchain for Embedded (ATfE, LLVM-based)
    - compiler: IAR # IAR Embedded Workbench
    - compiler: XC # MPLAB XC32 Compiler

  # ------------------------------------------------------------------
  # Packs consumed by this solution.
  # Pack syntax: vendor::pack-name[@version]
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#packs
  # ------------------------------------------------------------------
  packs:
    - pack: ARM::CMSIS@>=6.0.0
    - pack: Microchip::PIC32CM-PL_DFP@>=1.0.0
    - pack: Microchip::CMSIS-Driver_PIC32CM-PL@>=1.0.313

  # ------------------------------------------------------------------
  # Target device(s). Add more entries for multi-target builds; switch
  # with --context on the cbuild/csolution command line.
  # Device syntax: [[Dvendor::]Dname][:Pname]
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#target-types
  # ------------------------------------------------------------------
  target-types:
    - type: PIC32CM6408PL10048
      device: PIC32CM6408PL10048
      board: PIC32CM6408PL10048-CNANO:Rev 1
      target-set:
        - set:
          images:
            - project-context: SEGGER-RTT.Debug
          debugger:
            name: CMSIS-DAP@pyOCD
            clock: 10000000
            protocol: swd
            telnet:
              - mode: console
            rtt:
              - channel:
                  - number: 0
                    mode: stdio

  # ------------------------------------------------------------------
  # Build variants. Switch with --context <target>.<build>.
  # optimize values: balanced | size | speed | debug | none
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#build-types
  # ------------------------------------------------------------------
  build-types:
    - type: Debug
      debug: on
      optimize: debug
    - type: Release
      debug: off
      optimize: balanced

  # ------------------------------------------------------------------
  # Projects included in this solution.
  # Docs: https://open-cmsis-pack.github.io/cmsis-toolbox/YML-Input-Format/#projects
  # ------------------------------------------------------------------
  projects:
    - project: ./SEGGER-RTT.cproject.yml
  compiler: AC6
